name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the app
        run: |
          test -f index.html || { echo "index.html missing"; exit 1; }
          # Catch a truncated or malformed file before it ships.
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const blocks = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
            if (!blocks.length) throw new Error('no inline script found');
            new Function(blocks[blocks.length - 1][1]);
            console.log('index.html parses OK');
          "

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
